openapi: 3.0.3
info:
  title: Import Stocks API
  description: API for importing stock data into the עמדה system
  version: 1.0.0
  
servers:
  - url: /api
    description: Current server
  
paths:
  /stocks/import-stocks:
    post:
      summary: Import stocks
      description: Imports array of stock records with their values
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ImportedStock'
      responses:
        '200':
          description: Successfully imported stocks
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "successfully updated rows info , total:42 rows"
        '403':
          description: Authentication error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "forbidden"

components:
  schemas:
    ImportedStock:
      description:  אובייקט נייר ערך
      type: object
      required:
        - stockID
        - name
        - symbol
        - type
        - valueDate
      properties:
        stockID:
          type: integer
          description: מזהה נייר ערך
          example: 1080597
        name:
          type: string
          description: שם נייר ערך
          example: "גילת טלקום"
        symbol:
          type: string
          description: סימול נייר ערך
          example: "גלטל"
        type:
          type: string
          description: סוג נייר ערך
          enum:
            - מניות
            - אופציות
            - איגרות חוב
            - איגרות חוב להמרה
            - יחידת השתתפות
            - תעודות מדד
            - תעודות סל
            - קרנות נאמנות
            - נייר ערך מסחרי
            - אחר
            - זכויות
            - מק"מ
            - שטרי הון
        closingRate:
          type: number
          description: שער סגירה
          example: 68.6
        marketValue:
          type: number
          description: שווי שוק
          example: 59043375.159
        registeredValue:
          type: number
          description: הון רשום
          example: 86069060
        valueDate:
          type: string
          format: date-time
          description: תאריך ערך
          example: "2024-02-25T00:00:00"
        longName:
          type: string
          description: שם חברה
          example: "סאטקום מערכות בע״ם"

  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication for authorized users