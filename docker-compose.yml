version: '3'
services:
  payload-container:
    build:
      context: .
      dockerfile: Dockerfile
    image: imagedev
    env_file:
      - .env
    ports:
      - '3000:3000'
    environment:
      - HOST=0.0.0.0
      - DATABASE_URI
      - PAYLOAD_SECRET
      - GCS_BUCKET
      - GCS_PROJECT_ID
      - GCS_ENDPOINT
      - NEXT_PUBLIC_SERVER_URL=http://localhost:3000
      - LOGTAIL_SOURCE_TOKEN
      - TURNSTILE_SITE_KEY
      - TURNSTILE_SECRET_KEY
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY

    volumes:
      - node_modules:/app/node_modules
volumes:
  node_modules:
