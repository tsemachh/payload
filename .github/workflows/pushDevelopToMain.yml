name: Main CI - Tests & Back-merge to develop

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      pusher_name: ${{ steps.set_pusher.outputs.pusher_name }}
      pusher_email: ${{ steps.set_pusher.outputs.pusher_email }}
    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v3
      # Set commit author info
      - name: Set pusher info
        id: set_pusher
        run: |
          echo "pusher_name=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "pusher_email=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT
      # Step 2: MongoDB Atlas access
      - name: Permit runner to access MongoDB Atlas
        uses: textbook/atlas-ip@v1
        with:
          atlas-private-key: ${{ secrets.ATLAS_PRIVATE_KEY }}
          atlas-public-key: ${{ secrets.ATLAS_PUBLIC_KEY }}
          group-id: ${{ vars.ATLAS_GROUP_ID }}

      # Step 3: Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          use: true
          version: latest

      # Step 4: Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      
      # Step 5: Build and test
      - name: Build, Test, and Push
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          # Build the image without cache options to avoid driver errors
          docker build \
            --build-arg PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            --build-arg DATABASE_URI="$DATABASE_URI" \
            -t payload-image:local-test .

          # Run container
          docker run -d --name payload-container -p 3000:3000 payload-image:local-test

          # Wait for the app to start
          echo "Waiting for the application to start..."
          sleep 30

          # Check logs for debugging
          echo "Container logs:"
          docker logs payload-container

          # Test the application
          curl http://localhost:3000 || exit 1

          # Stop the container after testing
          docker stop payload-container

  backmerge:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Debug - Show commit and event info
        run: |
          echo "=== DEBUG INFO ==="
          echo "Commit message: '${{ github.event.head_commit.message }}'"
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo "Run number: ${{ github.run_number }}"
          echo "=================="
          
      - name: Configure Git user
        run: |
          git config user.name "${{ needs.docker-build.outputs.pusher_name }}"
          git config user.email "${{ needs.docker-build.outputs.pusher_email }}"


      - name: Create backmerge branch – cherry-pick last PR with real conflicts in PR
        id: backmerge
        run: |
          set -e
          BRANCH_NAME="backmerge/pr-to-develop-${{ github.run_id }}"
          echo "🌿 Creating branch: $BRANCH_NAME"
          git fetch origin develop main
          git checkout -b "$BRANCH_NAME" origin/develop
          
          LAST_PR_NUMBER=$(gh pr list --base main --state merged --limit 20 --json number,mergedAt --jq 'sort_by(.mergedAt) | reverse | .[0].number')
          if [ -z "$LAST_PR_NUMBER" ]; then
            echo "ℹ️ No merged PRs found recently"
            echo "create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "📌 Back-merging PR #$LAST_PR_NUMBER into develop"
          
          echo "🔍 Commits in PR #$LAST_PR_NUMBER:"
          gh pr view "$LAST_PR_NUMBER" --json commits --jq '.commits[] | "  • \(.oid[0:8]) - \(.messageHeadline)"'
          
          PR_COMMITS=$(gh pr view "$LAST_PR_NUMBER" --json commits --jq '.commits[].oid')
          CONFLICT_DETECTED=false
          CONFLICT_FILES=""
          COMMITS_APPLIED=0
          
          for commit in $PR_COMMITS; do
            echo "🍒 Cherry-picking $commit..."
            
            if git cat-file -p "$commit" | grep -q "^parent.*parent"; then
              echo "⚠️ Skipping merge commit $commit (merge commits are not cherry-picked)"
              continue
            fi
            
            # CHANGED_FILES=$(git show --name-only --pretty=format: "$commit" | grep -v '^$')
            # if echo "$CHANGED_FILES" | grep -q "^\.github/workflows/"; then
            #   echo "⚠️ Skipping commit $commit (contains workflow changes that require special permissions)"
            #   echo "Changed workflow files:"
            #   echo "$CHANGED_FILES" | grep "^\.github/workflows/" | sed 's/^/  • /'
            #   continue
            # fi
            
            if git cherry-pick "$commit"; then
              echo "✅ $commit applied cleanly"
              COMMITS_APPLIED=$((COMMITS_APPLIED + 1))
            else
              echo "⚠️ Conflict detected in $commit"
              CONFLICT_DETECTED=true
              # שומרים את רשימת הקבצים עם קונפליקטים
              CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
              echo "Conflicting files:"
              echo "$CONFLICT_FILES" | sed 's/^/  • /'
              
              # בודקים אם יש בפועל קבצים עם קונפליקטים
              if [ -n "$CONFLICT_FILES" ]; then
                # יש קונפליקטים אמיתיים - מוסיפים conflict markers ועושים commit
                echo "❌ Adding conflict files and creating commit for manual resolution"
                git add -A  # מוסיף את כל הקבצים כולל אלה עם conflict markers
                git commit --no-edit  # מסיים את ה-cherry-pick עם conflict markers
                COMMITS_APPLIED=$((COMMITS_APPLIED + 1))
                break
              else
                # אין קונפליקטים בפועל - מבטלים את ה-cherry-pick וממשיכים
                echo "ℹ️ No actual conflicts found, aborting cherry-pick and continuing"
                git cherry-pick --abort
                CONFLICT_DETECTED=false
                continue
              fi
            fi
          done
          
          echo "📊 Summary: Applied $COMMITS_APPLIED commits from PR #$LAST_PR_NUMBER"
          
          # בודקים אם יש שינויים להעלות
          if [ "$COMMITS_APPLIED" -eq 0 ] || git diff --quiet origin/develop..HEAD; then
            echo "ℹ️ No changes to back-merge, develop is already up to date"
            echo "create_pr=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ "$CONFLICT_DETECTED" = true ] && [ -n "$CONFLICT_FILES" ]; then
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            echo "conflict_files=$CONFLICT_FILES" >> $GITHUB_OUTPUT
          else
            echo "merge_status=success" >> $GITHUB_OUTPUT
          fi
          
          git --no-pager log -3 --oneline
          git push origin "$BRANCH_NAME" --force
          echo "create_pr=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

      - name: Create Pull Request via GitHub CLI
        if: steps.backmerge.outputs.create_pr == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="backmerge/pr-to-develop-${{ github.run_id }}"
          LAST_PR_NUMBER=$(gh pr list --base main --state merged --limit 1 --json number --jq '.[0].number')
          
          if [[ "${{ steps.backmerge.outputs.merge_status }}" == "conflict" ]]; then
            CONFLICT_LIST=$(echo "${{ steps.backmerge.outputs.conflict_files }}" | sed 's/^/• /' | paste -sd ',' -)
            TITLE="⚠️ Back-merge PR #$LAST_PR_NUMBER → develop (CONFLICTS)"
            BODY=$(cat <<EOF
          **קונפליקטים זוהו – דורש פתרון ידני**
          
          הניסיון האוטומטי להביא את השינויים מ-PR #$LAST_PR_NUMBER (שמורגג ל-main) אל develop נתקל בקונפליקטים.
          
          הקבצים עם קונפליקטים:
          $CONFLICT_LIST
          
          GitHub מציג את הקונפליקטים ישירות ב-PR – אנא השתמשו בכפתור "Resolve conflicts" לפתרון.
          לאחר פתרון הקונפליקטים, אשרו את ה-merge.
          
          מקור: https://github.com/${{ github.repository }}/pull/$LAST_PR_NUMBER
          Triggered by: ${{ github.actor }}
          EOF
          )
          else
            TITLE="Back-merge PR #$LAST_PR_NUMBER → develop"
            BODY=$(cat <<EOF
          Automatic back-merge of PR #$LAST_PR_NUMBER from main → develop.
          
          כל השינויים הוחלו בהצלחה ללא קונפליקטים.
          
          מקור: https://github.com/${{ github.repository }}/pull/$LAST_PR_NUMBER
          Triggered by: ${{ github.actor }}
          EOF
          )
          fi
          
          gh pr create \
            --head "$BRANCH_NAME" \
            --base develop \
            --title "$TITLE" \
            --body "$BODY" \
          || echo "ℹ️ PR already exists"
          
  notify-slack:
    needs: docker-build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
