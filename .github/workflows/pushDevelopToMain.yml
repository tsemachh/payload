name: Main CI - Tests & Back-merge to develop

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  docker-build:
    runs-on: ubuntu-latest
    outputs:
      pusher_name: ${{ steps.set_pusher.outputs.pusher_name }}
      pusher_email: ${{ steps.set_pusher.outputs.pusher_email }}
    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v3
      # Set commit author info
      - name: Set pusher info
        id: set_pusher
        run: |
          echo "pusher_name=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "pusher_email=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT
      # Step 2: MongoDB Atlas access
      - name: Permit runner to access MongoDB Atlas
        uses: textbook/atlas-ip@v1
        with:
          atlas-private-key: ${{ secrets.ATLAS_PRIVATE_KEY }}
          atlas-public-key: ${{ secrets.ATLAS_PUBLIC_KEY }}
          group-id: ${{ vars.ATLAS_GROUP_ID }}

      # Step 3: Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          use: true
          version: latest

      # Step 4: Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      
      # Step 5: Build and test
      - name: Build, Test, and Push
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          # Build the image without cache options to avoid driver errors
          docker build \
            --build-arg PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            --build-arg DATABASE_URI="$DATABASE_URI" \
            -t payload-image:local-test .

          # Run container
          docker run -d --name payload-container -p 3000:3000 payload-image:local-test

          # Wait for the app to start
          echo "Waiting for the application to start..."
          sleep 30

          # Check logs for debugging
          echo "Container logs:"
          docker logs payload-container

          # Test the application
          curl http://localhost:3000 || exit 1

          # Stop the container after testing
          docker stop payload-container

  backmerge:
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create backmerge branch – cherry-pick current PR commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          BRANCH_NAME="backmerge/pr-${{ github.event.pull_request.number }}-to-develop-${{ github.run_id }}"
          echo "🌿 Creating branch: $BRANCH_NAME"

          # וודא שיש לנו את כל ההיסטוריה
          git fetch origin develop
          git fetch origin main

          # יצירת branch חדש מ-develop
          git checkout -b "$BRANCH_NAME" origin/develop

          # מוצאים את ה-PR האחרון שהומרג ל-main
          LAST_PR_NUMBER=$(gh pr list \
            --base main \
            --state merged \
            --limit 10 \
            --json number,mergedAt \
            --jq 'sort_by(.mergedAt) | last(.[]).number'
          )

          echo "📌 Last merged PR to main: #$LAST_PR_NUMBER"

          # מקבלים את כל הקומיטים של ה-PR האחרון
          PR_COMMITS=$(gh pr view "$LAST_PR_NUMBER" --json commits --jq '.commits[].oid')

          # Cherry-pick של כל הקומיטים האלה
          for commit in $PR_COMMITS; do
            echo "📌 Cherry-picking commit $commit"
            git cherry-pick "$commit" || echo "⚠️ Conflict detected – leave for manual resolution"
          done


          # דחיפה ל-origin
          git push origin "$BRANCH_NAME" --force


      - name: Debug – verify changes exist
        run: |
          git fetch origin develop
          echo "📌 Commits in backmerge branch not in develop:"
          git log origin/develop..HEAD --oneline || echo "No new commits – develop already up to date"
          echo ""
          echo "📊 File changes:"
          git diff --stat origin/develop..HEAD || echo "No changes"
      - name: Create Pull Request via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="backmerge/main-to-develop-${{ github.run_id }}"

          PR_BODY=$(cat <<'EOF'
          Automatic back-merge to keep develop in sync with main.

          Triggered by commit: ${{ github.sha }}
          Actor: ${{ github.actor }}
          EOF
          )

          gh pr create \
            --head "$BRANCH_NAME" \
            --base develop \
            --title "Back-merge main → develop" \
            --body "$PR_BODY" \


      # - name: Create Pull Request
      #   uses: peter-evans/create-pull-request@v6
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     title: "Back-merge: main → develop"
      #     body: |
      #       Automatic back-merge to keep `develop` in sync with `main`.

      #       Triggered by push to `main` (commit: ${{ github.sha }}).
      #       Actor: ${{ github.actor }}

      #       This integrates hotfixes and releases from `main` into `develop`.
      #     branch: backmerge/main-to-develop-${{ github.run_id }}
      #     base: develop
      #     labels: automated, back-merge
      #     draft: false
      #     delete-branch: true  # מנקה את ה-branch אחרי merge או סגירה
      - name: Debug – completion
        run: |
          echo "✅ Workflow completed"
          echo "If no PR was created – develop was already in sync with main."
  notify-slack:
    needs: docker-build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
