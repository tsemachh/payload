name: Docker Emda Payload Image CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Set up Google Cloud credentials
      - name: Set up Google Cloud credentials
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Step 2: Checkout the repository
      - name: Checkout the repository
        uses: actions/checkout@v3

      # Step 3: Set tag parameter based on the event type
      - name: Set tag parameter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TAG=pr" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=release" >> $GITHUB_ENV
          fi

      # Step 4: Permit runner to access MongoDB Atlas
      - name: Permit runner to access MongoDB Atlas
        uses: textbook/atlas-ip@v1
        with:
          atlas-private-key: ${{ secrets.ATLAS_PRIVATE_KEY }}
          atlas-public-key: ${{ secrets.ATLAS_PUBLIC_KEY }}
          group-id: ${{ vars.ATLAS_GROUP_ID }}

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          use: true
          version: latest

      # Step 6: Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Step 7: Login to Google Cloud Registry (GCR)
      - name: Login to GCR (private registry)
        uses: docker/login-action@v2
        with:
          registry: me-west1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Step 8: Build and push Docker image to GCR
      - name: Build and push Docker image to GCR
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}  # MongoDB connection string
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}  # Payload CMS secret
        uses: docker/build-push-action@v3
        with:
          context: ./  # Path to the repository
          push: true
          tags: me-west1-docker.pkg.dev/emda-dev/emda-gcr/payload-image:${{ env.TAG }}  # Target private GCR
          file: ./Dockerfile  # Path to Dockerfile
          build-args: |
            "PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}"
            "DATABASE_URI=${{ secrets.DATABASE_URI }}"
          cache-from: type=local,src=/tmp/.buildx-cache  # Cache for faster builds
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      # Step 9: Move cache after build
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Step 10: Run Docker container for Payload CMS and Test with curl
      - name: Run Docker container for Payload CMS and Test with curl
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}  # MongoDB connection string
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}  # Payload CMS secret
        run: |
          docker run --rm \
            -e DATABASE_URI=${{ secrets.DATABASE_URI }} \
            -e PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }} \
            -p 3000:3000 \
            me-west1-docker.pkg.dev/emda-dev/emda-gcr/payload-image:${{ env.TAG }} &
          # Sleep for 40 seconds to give the app time to start up
          sleep 40
          # Test if the application is responding on localhost:3000
          curl --silent --fail http://localhost:3000 || exit 1

  # Step 11: Notify Slack on failure
  notify-slack:
    needs: [docker-build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        with:
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          text: "Docker build or tests failed for branch ${{ github.ref }}. Please check the logs for details."
