name: Process Meetings

on:
  schedule:
    - cron: '0 0 * * *' # Run at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  process-meetings:
    runs-on: ubuntu-latest
    steps:
      - name: Process Meetings
        run: |
          curl -X POST \
            -H "Authorization: users API-Key ${{secrets.API_KEY}}" \
            -H "Content-Type: application/json" \
            -d '{"runType": "github-action", "timestamp": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' \
            ${{secrets.API_URL}}/api/meetings/process-meetings
