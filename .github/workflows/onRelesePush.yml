name: Update image tag and ArgoCD Application on Release

on:
  release:
    types: [published]

jobs:
  docker-build-and-update:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v3

      # Step 2: Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Step 3: Set up Google Cloud credentials
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      # Step 4: MongoDB Atlas access
      - name: Permit runner to access MongoDB Atlas
        uses: textbook/atlas-ip@v1
        with:
          atlas-private-key: ${{ secrets.ATLAS_PRIVATE_KEY }}
          atlas-public-key: ${{ secrets.ATLAS_PUBLIC_KEY }}
          group-id: ${{ vars.ATLAS_GROUP_ID }}

      # Step 5: Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          use: true
          version: latest

      # Step 6: Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Step 7: Login to Google Container Registry
      - name: Login to Google Container Registry
        uses: docker/login-action@v2
        with:
          registry: me-west1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Step 8: Build and test Docker image
      - name: Build, Test, and Push
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          # Set version for cache invalidation
          APP_VERSION="${{ github.event.release.tag_name }}"
          BUILD_TIME="$(date +%s)"

          # Build the image
          docker build \
            --build-arg PAYLOAD_SECRET="$PAYLOAD_SECRET" \
            --build-arg DATABASE_URI="$DATABASE_URI" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t payload-image:local-test .

          # Run container
          docker run -d --name payload-container -p 3000:3000 payload-image:local-test

          # Wait for the app to start
          echo "Waiting for the application to start..."
          sleep 30

          # Check logs for debugging
          echo "Container logs:"
          docker logs payload-container

          # Test the application
          curl http://localhost:3000 || exit 1

          # Stop the container after testing
          docker stop payload-container

      # Step 9: Tag and Push Docker image to GCR
      - name: Tag and Push Docker image
        run: |
          docker tag payload-image:local-test me-west1-docker.pkg.dev/emda-dev/emda-gcr/payload-image:${{ github.event.release.tag_name }}
          docker tag payload-image:local-test me-west1-docker.pkg.dev/emda-dev/emda-gcr/payload-image:latest
          if docker push me-west1-docker.pkg.dev/emda-dev/emda-gcr/payload-image:${{ github.event.release.tag_name }} && \
             docker push me-west1-docker.pkg.dev/emda-dev/emda-gcr/payload-image:latest; then
            echo "NEW_IMAGE_PUSHED=true" >> $GITHUB_ENV
          else
            echo "NEW_IMAGE_PUSHED=false" >> $GITHUB_ENV
          fi

      # Step 10: Install yq and update ArgoCD config
      - name: Install yq and update ArgoCD config
        if: env.NEW_IMAGE_PUSHED == 'true'
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.43.1/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
          yq --version

          # Clone ArgoCD config repo
          git clone https://x-access-token:${{ secrets.EMDA_ARGOCD_PER }}@github.com/shefing/emda-argocd.git
          cd emda-argocd

          # Update image tag in helm/values.yaml
          yq e -i ".image.tag = \"${{ github.event.release.tag_name }}\"" helm/prodValues.yaml

          # Update targetRevision in Application YAML
          yq e -i ".spec.source.targetRevision = \"${{ github.event.release.tag_name }}\"" argocd/applications/prod-application.yaml

          # Commit and push changes
          git config user.email "ci-bot@emda.dev"
          git config user.name "Emda CI Bot"
          git add  helm/prodValues.yaml argocd/applications/prod-application.yaml
          git commit -m "ci: update image tag and targetRevision to ${{ github.event.release.tag_name }}"
          git push origin main

      # Step 11: Notify Slack - Deployment Completed
      - name: Notify Slack - Deployment Completed
        if: ${{ success() && env.NEW_IMAGE_PUSHED == 'true' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'New Docker image and ArgoCD Application updated to ${{ github.event.release.tag_name }}!'

  notify-slack:
    needs: docker-build-and-update
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Failed to update Docker image or ArgoCD Application for release ${{ github.event.release.tag_name }}'
