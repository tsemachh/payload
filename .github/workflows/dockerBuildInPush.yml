name: Docker Emda Payload Image CI

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  REGISTRY: me-west1-docker.pkg.dev
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  docker-build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v4

      # Step 2: Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Step 3: Set up Google Cloud credentials
      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 4: Set tag parameter
      - name: Set tag parameter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "TAG=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=release" >> $GITHUB_ENV
          fi

      # Step 5: MongoDB Atlas access
      - name: Permit runner to access MongoDB Atlas
        uses: textbook/atlas-ip@v1
        with:
          atlas-private-key: ${{ secrets.ATLAS_PRIVATE_KEY }}
          atlas-public-key: ${{ secrets.ATLAS_PUBLIC_KEY }}
          group-id: ${{ vars.ATLAS_GROUP_ID }}

      # Step 6: Docker setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Step 8: Login to GCR
      - name: Login to Google Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS_JSON }}

      # Step 9: Build and test
      - name: Build, Test, and Push
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        run: |
          # Set version for cache invalidation
          APP_VERSION="${GITHUB_SHA:0:7}"
          
          # Build with cache
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --build-arg APP_VERSION=$APP_VERSION \
            --build-arg DATABASE_URI=$DATABASE_URI \
            --build-arg PAYLOAD_SECRET=$PAYLOAD_SECRET \
            --tag ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/payload-app:${{ env.TAG }} \
            --tag ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/payload-app:$APP_VERSION \
            --load \
            --file ./Dockerfile \
            .
          
          # Run tests
          docker run --rm \
            -e DATABASE_URI=$DATABASE_URI \
            -e PAYLOAD_SECRET=$PAYLOAD_SECRET \
            ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/payload-app:${{ env.TAG }} \
            npm test
          
          # Push only if tests pass and not a PR
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker buildx build \
              --cache-from type=local,src=/tmp/.buildx-cache \
              --build-arg APP_VERSION=$APP_VERSION \
              --build-arg DATABASE_URI=$DATABASE_URI \
              --build-arg PAYLOAD_SECRET=$PAYLOAD_SECRET \
              --tag ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/payload-app:${{ env.TAG }} \
              --tag ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/payload-app:$APP_VERSION \
              --push \
              --file ./Dockerfile \
              .
            echo "NEW_IMAGE_PUSHED=true" >> $GITHUB_ENV
            echo "NEW_TAG=${{ env.TAG }}" >> $GITHUB_ENV
          fi
          
          # Move cache to avoid growth
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Step 10: Print NEW_IMAGE_PUSHED Value
      - name: Print NEW_IMAGE_PUSHED Value
        if: env.NEW_IMAGE_PUSHED == 'true'
        run: echo "NEW_IMAGE_PUSHED=${{ env.NEW_IMAGE_PUSHED }}"

      # Step 11: Notify Slack - Deployment Completed
      - name: Notify Slack - Deployment Completed
        if: success() && env.NEW_IMAGE_PUSHED == 'true'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'New Docker image deployed to GCR!'

  notify-slack:
    needs: docker-build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Docker build failed!'
          SLACK_COLOR: danger
